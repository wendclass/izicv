<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="izi-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="izi-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0d9488" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Squircle Background -->
  <rect x="36" y="32" width="440" height="440" rx="120" ry="120" fill="url(#izi-grad)" filter="url(#izi-shadow)"/>
  <!-- Document Outline -->
  <g fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Document Body with Folded Top-Right Corner -->
    <path d="M 180 135 L 295 135 L 350 190 L 350 375 A 25 25 0 0 1 325 400 L 180 400 A 25 25 0 0 1 155 375 L 155 160 A 25 25 0 0 1 180 135 Z"/>
    <!-- Fold Flap -->
    <path d="M 295 135 L 295 190 L 350 190"/>
    <!-- Inside Lines -->
    <line x1="205" y1="235" x2="245" y2="235" stroke-width="22"/>
    <line x1="205" y1="285" x2="300" y2="285" stroke-width="22"/>
    <line x1="205" y1="335" x2="300" y2="335" stroke-width="22"/>
  </g>
</svg>
